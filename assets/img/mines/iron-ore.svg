<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Mine site">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241C2E"/><stop offset="1" stop-color="#4A2A34"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E3B33"/><stop offset="1" stop-color="#4A2A34"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0503A"/><stop offset="1" stop-color="#7E3B33"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D98A5A"/><stop offset="1" stop-color="#B0503A"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="497" cy="86" r="34" fill="url(#sun)" opacity=".9"/>
  <circle cx="497" cy="86" r="58" fill="#D98A5A" opacity=".12"/>

  <!-- distant ridge -->
  <path d="M0 214 L96 168 L182 196 L268 152 L360 190 L452 158 L546 194 L640 166 L640 360 L0 360Z"
        fill="url(#far)" opacity=".85"/>

  <!-- terraced open pit -->
  <path d="M40 360 L120 250 L520 250 L600 360Z" fill="url(#near)"/>
  <g stroke="#ffffff" stroke-opacity=".16" stroke-width="2" fill="none">
    <path d="M120 250h400"/><path d="M100 278h440"/><path d="M78 306h484"/><path d="M58 334h524"/>
  </g>
  <g stroke="#000000" stroke-opacity=".14" stroke-width="6" fill="none">
    <path d="M132 264h376"/><path d="M110 292h420"/><path d="M88 320h464"/>
  </g>

  <!-- haul truck -->
  <g transform="translate(228,268) scale(1.05)">
    <path d="M2 22h56l10-24H18L2 22Z" fill="#D98A5A"/>
    <rect x="56" y="8" width="26" height="14" rx="3" fill="#ffffff" opacity=".92"/>
    <rect x="0" y="22" width="86" height="8" rx="4" fill="#ffffff" opacity=".5"/>
    <circle cx="20" cy="34" r="9" fill="#241C2E" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.5"/>
    <circle cx="66" cy="34" r="9" fill="#241C2E" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.5"/>
  </g>

  <!-- dust haze -->
  <ellipse cx="320" cy="352" rx="260" ry="24" fill="#D98A5A" opacity=".10"/>
</svg>
