<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Contact photo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#E9ECF7"/><stop offset="1" stop-color="#D5DAEC"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C60C6"/><stop offset="1" stop-color="#42469E"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDEFF7"/>
    </linearGradient>
    <clipPath id="round"><circle cx="80" cy="80" r="80"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="160" height="160" fill="url(#bg)"/>
    <circle cx="80" cy="46" r="52" fill="#ffffff" opacity=".35"/>

    <!-- shoulders / shirt -->
    <path d="M18 160c0-28 20-46 44-52l18-6 18 6c24 6 44 24 44 52Z" fill="url(#shirt)"/>
    <!-- collar -->
    <path d="M62 102l18 20 18-20 10 5-28 30-28-30Z" fill="url(#collar)"/>

    <!-- neck -->
    <path d="M67 88h26v20c0 7-26 7-26 0Z" fill="#E0AC8B"/>
    <path d="M67 88h26v9c-8 6-18 6-26 0Z" fill="#C9906F" opacity=".55"/>

    <!-- head -->
    <ellipse cx="80" cy="64" rx="26" ry="30" fill="#EFBE9C"/>
    <!-- ears -->
    <circle cx="54" cy="66" r="5" fill="#E0AC8B"/><circle cx="106" cy="66" r="5" fill="#E0AC8B"/>
    <!-- hair -->
    <path d="M52 62c-2-22 12-34 28-34s30 12 28 34c-3-12-10-17-18-19-9 8-25 8-31 3-4 3-6 9-7 16Z" fill="#4A3B36"/>
    <!-- brows + eyes -->
    <path d="M66 58h11M83 58h11" stroke="#4A3B36" stroke-width="3" stroke-linecap="round"/>
    <circle cx="71" cy="67" r="3.2" fill="#3B3F52"/><circle cx="89" cy="67" r="3.2" fill="#3B3F52"/>
    <!-- nose + mouth -->
    <path d="M80 70v7l-3 2" stroke="#D89C79" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M73 84c4 4 10 4 14 0" stroke="#C97F63" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
